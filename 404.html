<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Redirection — Studio Fontaine</title>
  <script>
    (function () {
      var path = location.pathname;
      var parts = path.split("/").filter(Boolean);
      var root = "";
      if (/\.github\.io$/i.test(location.hostname) && parts.length) {
        root = "/" + parts[0];
        parts = parts.slice(1);
      }
      var rest = parts.length ? "/" + parts.join("/") : "/";
      if (rest === "/404.html" || rest === "/index.html") rest = "/";
      location.replace(root + "/#" + rest + location.search);
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=./#/" />
</head>
<body>
  <p><a href="./">Retour à l’accueil</a></p>
</body>
</html>
